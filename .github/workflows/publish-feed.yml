name: Publish Omarchy edge RSS

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-edge-rss
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feed state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare remote snapshot cache
        run: mkdir -p data site

      - name: Restore previous package snapshot and feed history
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            site/feed.xml
          key: edge-rss-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            edge-rss-state-

      - name: Remember currently published feed
        run: |
          if [[ -f site/feed.xml ]]; then
            sha256sum site/feed.xml | cut -d ' ' -f 1 > "$RUNNER_TEMP/edge-rss-before"
          else
            printf 'missing\n' > "$RUNNER_TEMP/edge-rss-before"
          fi

      - name: Read edge repositories and build RSS
        run: python feed_builder.py

      - name: Save remote package snapshot and RSS history
        uses: actions/cache/save@v4
        with:
          path: |
            data
            site/feed.xml
          key: edge-rss-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check whether the published feed changed
        id: feed
        run: |
          before=$(<"$RUNNER_TEMP/edge-rss-before")
          after=$(sha256sum site/feed.xml | cut -d ' ' -f 1)
          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.feed.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload RSS site
        if: steps.feed.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish RSS site
        if: steps.feed.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
